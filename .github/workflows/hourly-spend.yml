name: Meta Hourly Spend Pacing

on:
  workflow_dispatch:
  repository_dispatch:
    types: [hourly-spend]

permissions:
  contents: read

jobs:
  hourly-spend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCESS_TOKEN_2: ${{ secrets.META_ACCESS_TOKEN_2 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          BUSINESS_IDS: ${{ vars.BUSINESS_IDS }}
          META_API_VERSION: ${{ vars.META_API_VERSION }}

          REPORT_TIMEZONE: Africa/Cairo
          SHEET_TAB: Spend Tracker
          MAX_WORKERS: "8"

        run: python hourly_spend_tracker.py
